services:
  guest-assistant:
    image: node:22-alpine
    container_name: guest-assistant
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - PORT=${PORT:-3456}
      - HA_URL=${HA_URL:-http://192.168.68.30:8123}
      - HA_TOKEN=${HA_TOKEN}
    command:
      - sh
      - -c
      - |
        mkdir -p /app/public &&
        echo "" | base64 -d | gunzip > /app/server.js &&
        echo "" | base64 -d | gunzip > /app/public/index.html &&
        node /app/server.js
